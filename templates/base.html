<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}آزمایشگاه امنیت نشست{% endblock %}</title>
    
    <!-- Bootstrap 5 RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    
    <!-- Vazirmatn Persian Font -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    
    <style>
        * {
            font-family: 'Vazirmatn', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
        }
        
        .navbar-custom {
            background-color: {{ theme_color }} !important;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        
        .card-glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .card-glass-light {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }
        
        .mode-badge {
            background-color: {{ theme_color }};
            color: white;
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: 600;
            display: inline-block;
            box-shadow: 0 4px 15px {{ theme_color }}40;
        }
        
        .btn-custom {
            background-color: {{ theme_color }};
            border: none;
            border-radius: 12px;
            padding: 12px 30px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px {{ theme_color }}40;
        }
        
        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px {{ theme_color }}60;
            filter: brightness(1.1);
        }
        
        .form-control-custom {
            border-radius: 12px;
            padding: 14px 20px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s ease;
        }
        
        .form-control-custom:focus {
            border-color: {{ theme_color }};
            box-shadow: 0 0 0 4px {{ theme_color }}20;
        }
        
        .session-id-box {
            background: linear-gradient(135deg, #2d2d2d, #1a1a1a);
            color: #00ff00;
            font-family: 'Courier New', monospace;
            padding: 20px;
            border-radius: 12px;
            word-break: break-all;
            direction: ltr;
            text-align: left;
            font-size: 1.1rem;
            border: 2px solid #333;
        }
        
        .icon-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: {{ theme_color }};
            color: white;
            font-size: 2rem;
            margin: 0 auto 20px;
            box-shadow: 0 4px 20px {{ theme_color }}50;
        }
        
        .warning-box {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        
        .success-box {
            background: linear-gradient(135deg, #26de81, #20bf6b);
            color: white;
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        
        .nav-links a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        
        .nav-links a:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                🔐 آزمایشگاه امنیت نشست
            </a>
            <div class="d-flex align-items-center nav-links">
                <span class="badge bg-light text-dark me-3 px-3 py-2">{{ mode_label }}</span>
                <a href="/vulnerable/login">🔴 آسیب‌پذیر</a>
                <a href="/secure/login">🟢 امن</a>
            </div>
        </div>
    </nav>
    
    <!-- Main Content -->
    <main class="container py-5">
        {% block content %}{% endblock %}
    </main>
    
    <!-- Footer -->
    <footer class="text-center py-4 text-white-50">
        <small>
            این پروژه صرفاً جهت آموزش امنیت وب طراحی شده است.
            <br>
            ⚠️ هرگز از الگوهای آسیب‌پذیر در محیط تولید استفاده نکنید!
        </small>
    </footer>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
